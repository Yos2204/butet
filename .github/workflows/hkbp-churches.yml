# Nearest HKBP list (YB 2026-11-01): once a month, ask OpenStreetMap (free) for every HKBP church in the world and
# save it as hkbp/nearest/churches.json for Sada's "Nearest HKBP" page. Also runs when the builder or extra.json changes.
name: HKBP churches list
on:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths: ["tools/hkbp-churches/**", "hkbp/nearest/extra.json", ".github/workflows/hkbp-churches.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hkbp-churches
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch HKBP churches from OpenStreetMap
        run: node tools/hkbp-churches/build.mjs
      - name: Save the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add hkbp/nearest/churches.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Nearest HKBP: refresh the church list from OpenStreetMap"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
