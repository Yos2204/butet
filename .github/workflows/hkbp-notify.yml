# Sends HKBP Singapore notifications (daily bread, birthdays, event reminders, announcements).
# Does nothing until the Supabase secrets are added. See hkbp/README.md.
name: HKBP notifications
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: hkbp-notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hkbp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node notify.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
