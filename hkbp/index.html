<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sada HKBPS</title>
<meta name="description" content="HKBP Singapore church app: categorial groups, service rosters, daily bread, birthdays, elders' updates and events.">
<meta name="theme-color" content="#2f3189">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Sada HKBPS">
<meta name="apple-mobile-web-app-title" content="Sada HKBPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f3f5fa; --surface: #ffffff; --surface-2: #eef1f8; --ink: #0e1a33; --muted: #5f6b85; --line: #e1e6f0;
  --brand: #2f3189; --brand-ink: #ffffff; --brand-soft: #e6ecfa; --gold: #c99a2e; --gold-soft: #fbf1d6; --red: #c8322b;
  --good: #16a34a; --warn: #b45309; --danger: #dc2626; --shadow: 0 1px 2px rgba(14,26,51,.06), 0 8px 24px rgba(14,26,51,.06);
  --display: "Fraunces", Georgia, serif; --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1224; --surface: #111c33; --surface-2: #17243f; --ink: #e9eefa; --muted: #98a5c0; --line: #22314f;
    --brand: #8fb0ff; --brand-ink: #0a1224; --brand-soft: #1a2a4d; --gold: #e7bf55; --gold-soft: #2b2614; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.5 var(--body); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100vh; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: -.01em; }
h2 { font-family: var(--display); font-weight: 700; font-size: 22px; }
h3 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
h4 { font-size: 14px; margin: 14px 0 6px; display: flex; gap: 6px; align-items: center; }
p { margin: 6px 0; }
.ic { width: 20px; height: 20px; flex: none; }
.small { font-size: 13px; } .muted { color: var(--muted); } .center { text-align: center; } .pad { padding: 12px 0; } .warn { color: var(--warn); }
.pre { white-space: pre-wrap; }
.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 14px; }

#view { max-width: 680px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; margin: 0 -16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); }
header.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 4px; background: repeating-linear-gradient(90deg, var(--red) 0 14px, #111 14px 17px, #fbf3e4 17px 21px, #111 21px 24px); opacity: .85; }
.logo-sm { width: 40px; height: 40px; padding: 5px; object-fit: contain; border-radius: 12px; background: #fff; box-shadow: var(--shadow); flex: none; }
.brand { flex: 1; min-width: 0; }
.brand b { display: block; font-family: var(--display); font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.langs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
.langs button { border: 0; background: none; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.banner { margin: 12px 0 0; padding: 9px 12px; border-radius: 12px; background: var(--gold-soft); color: var(--warn); font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.banner.soft { background: var(--brand-soft); color: var(--brand); }
main { padding-top: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.card.soft { background: var(--surface-2); box-shadow: none; }
.card-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
.card-h a { font-weight: 700; }
.sec-h { margin: 22px 2px 4px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.page-h { margin-top: 14px; }
.lead { color: var(--muted); margin: 4px 0 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.row.end { justify-content: flex-end; }
.row.two > * { flex: 1 1 140px; }
.stack { display: grid; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
[style*="--gc"] .btn.primary, .btn.primary[style*="--gc"] { background: var(--gc); border-color: var(--gc); color: #fff; }
.btn.wa { background: #1fa855; border-color: #1fa855; color: #fff; }
.btn.ghost { background: transparent; border-style: dashed; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn.sure { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; margin: 10px 0; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.icon-btn.wa { color: #1fa855; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; margin-right: 6px; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 800; background: var(--surface-2); color: var(--muted); vertical-align: middle; }
.badge .ic { width: 12px; height: 12px; }
.badge.chair { background: var(--gold-soft); color: var(--warn); }
.badge.member { background: var(--brand-soft); color: var(--brand); }
.badge.admin { background: #fde7e5; color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink); }
.chip[style*="--gc"] { border-color: color-mix(in srgb, var(--gc) 40%, transparent); background: color-mix(in srgb, var(--gc) 10%, var(--surface)); }
.empty { text-align: center; color: var(--muted); padding: 34px 12px; }
.empty .ic { width: 40px; height: 40px; opacity: .5; }

/* list rows */
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.li:last-child { border-bottom: 0; }
.li .grow, .grow { flex: 1; min-width: 0; }
.li b { display: block; font-weight: 700; }
.li small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.li .chev, .chev { color: var(--muted); width: 18px; height: 18px; }
.li.past { opacity: .55; }
.avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--brand-soft); color: var(--brand); }
.avatar.lg { width: 58px; height: 58px; font-size: 20px; }
.date-chip { width: 48px; flex: none; text-align: center; border-radius: 12px; padding: 5px 0; background: color-mix(in srgb, var(--gc, var(--brand)) 13%, var(--surface)); color: var(--gc, var(--brand)); }
.date-chip b { display: block; font-family: var(--display); font-size: 20px; line-height: 1.05; }
.date-chip small { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: inherit; }
.party { font-size: 22px; }

/* home */
.hello { padding: 14px 2px 2px; }
.hello h1 { margin-top: 2px; }
.kicker { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.kicker .ic { width: 16px; height: 16px; }
.bread-card { background: linear-gradient(155deg, #3a3ca0, #1c1d5e 70%); color: #fff; border: 0; position: relative; overflow: hidden; }
.bread-card::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(246,215,122,.35), transparent 70%); }
.bread-card h2 { color: #fff; margin: 2px 0 6px; }
.bread-card .muted, .bread-card p { color: #d6def2; }
.bread-card .verse-ref { color: #f6d77a; }
.bread-card .btn:not(.wa):not(.primary) { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: #fff; }
.bread-card .btn.primary { background: #f6d77a; border-color: #f6d77a; color: #2a1c00; }
.verse-ref { color: var(--gold); font-weight: 800; letter-spacing: .01em; margin-top: 8px; }
.verse-ref.big { font-size: 17px; }
.hbd { display: flex; gap: 14px; align-items: center; background: linear-gradient(135deg, #fff1d6, #ffe2ea); border: 0; color: #4a2a00; }
.hbd .ic { width: 44px; height: 44px; color: #d0518a; }
.hbd h2 { color: #8a2a52; }
.notify-ask { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border-style: dashed; }
.notify-ask .ic:first-child { color: var(--gold); width: 26px; height: 26px; }
.notify-ask b { display: block; } .notify-ask small { color: var(--muted); display: block; }
.update { padding: 8px 0; border-bottom: 1px solid var(--line); }
.update:last-child { border-bottom: 0; }
.card > .update { border: 0; padding: 0; }
.update .meta, .post .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.update .meta .ic { width: 14px; height: 14px; color: var(--gold); }
.update b { display: block; font-size: 16px; margin: 2px 0; }
.update.pinned b { color: var(--brand); }

/* groups */
.gcards { display: grid; gap: 12px; }
.gcard { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 4px 14px; padding: 18px; border-radius: 22px; overflow: hidden; color: #fff; background: var(--gc); box-shadow: 0 10px 30px color-mix(in srgb, var(--gc) 35%, transparent); min-height: 130px; }
.gcard-bg { position: absolute; inset: 0; background:
  linear-gradient(130deg, transparent 40%, rgba(0,0,0,.18)),
  repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 2px, transparent 2px 16px); }
.gcard-bg::after { content: ""; position: absolute; right: -10px; bottom: 0; width: 160px; height: 26px; background: linear-gradient(45deg, transparent 50%, rgba(255,255,255,.14) 50%) 0 0/26px 26px, linear-gradient(-45deg, transparent 50%, rgba(255,255,255,.14) 50%) 0 0/26px 26px; }
.gcard > *:not(.gcard-bg) { position: relative; }
.gcard.locked { filter: saturate(.55); }
.gcard-t b { display: block; font-family: var(--display); font-size: 21px; font-weight: 700; }
.gcard-t small { display: block; opacity: .9; font-size: 13px; line-height: 1.35; margin-top: 3px; }
.gcard-f { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-weight: 600; opacity: .95; }
.gcard .badge { background: rgba(255,255,255,.22); color: #fff; }
.gicon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--gc) 14%, var(--surface)); color: var(--gc); }
.gicon .ic { width: 24px; height: 24px; }
.gicon.lg, .gicon.xl { background: rgba(255,255,255,.2); color: #fff; width: 54px; height: 54px; border-radius: 16px; }
.gicon.lg .ic { width: 28px; height: 28px; }
.gicon.xl { width: 64px; height: 64px; border-radius: 20px; }
.gicon.xl .ic { width: 34px; height: 34px; }
.glist { display: grid; gap: 8px; margin-top: 8px; }
.gtile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gc); border-radius: 16px; color: var(--ink); box-shadow: var(--shadow); }
.gname { flex: 1; min-width: 0; }
.gname b { display: block; font-weight: 800; }
.gname small { display: block; color: var(--muted); font-size: 12.5px; }
.ghero { margin: 14px 0 10px; padding: 22px 18px; border-radius: 24px; color: #fff; display: flex; gap: 16px; align-items: center; position: relative; overflow: hidden;
  background: radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.22), transparent 55%), linear-gradient(135deg, var(--gc), color-mix(in srgb, var(--gc) 60%, #000)); }
.ghero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(45deg, transparent 50%, rgba(255,255,255,.18) 50%) 0 0/20px 20px, linear-gradient(-45deg, transparent 50%, rgba(255,255,255,.18) 50%) 0 0/20px 20px; }
.ghero h2 { color: #fff; font-size: 24px; }
.ghero p { margin: 4px 0 0; opacity: .92; font-size: 14px; }
.ghero.slim { padding: 16px 18px; }
.hero-role { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hero-role .badge { background: rgba(255,255,255,.25); color: #fff; }
.hero-role small { opacity: .9; }
.seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin: 12px 0; overflow-x: auto; scrollbar-width: none; }
.seg a { flex: 1; text-align: center; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg a[aria-selected="true"] { background: var(--gc); color: #fff; }
.seg i { font-style: normal; font-size: 11px; opacity: .8; }
.post { border-top: 4px solid var(--gc); }
.post h3 { font-family: var(--display); font-size: 19px; font-weight: 700; margin-top: 4px; }
details summary { cursor: pointer; color: var(--gc, var(--brand)); font-weight: 700; margin-top: 6px; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details[open] summary { display: none; }

/* rosters */
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.monthbar b { font-family: var(--display); font-size: 18px; text-transform: capitalize; }
.mine { border-left: 4px solid var(--gc); }
.mine h3 .ic { color: var(--good); }
.roster-h { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.roster-h b { display: block; } .roster-h small { color: var(--muted); display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ftype { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: #64748b; }
.ftype.xls { background: #1d7a45; } .ftype.pdf { background: #c8322b; } .ftype.doc { background: #2b5cb8; } .ftype.img { background: #7c5cff; } .ftype.link { background: #0f766e; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; -webkit-overflow-scrolling: touch; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 70px; }
.tbl th { background: var(--surface-2); font-weight: 800; position: sticky; top: 0; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.me td { background: color-mix(in srgb, var(--gc, var(--gold)) 7%, transparent); }
.tbl td.me { background: color-mix(in srgb, var(--gc, var(--gold)) 22%, transparent) !important; font-weight: 800; }
.tbl tr.bad td { background: color-mix(in srgb, var(--danger) 8%, transparent); }
.img-slot img { width: 100%; border-radius: 12px; }

/* bread page */
.bread-full { padding: 18px 2px 6px; }
.bread-full h1 { margin: 8px 0 4px; font-size: 30px; }
.bread-full .body { font-size: 17px; line-height: 1.7; margin: 14px 0; }
.ai-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 14px; margin: 10px 0; }
.ai-box span { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 150px; }
.ai-box select { width: auto; }

/* forms */
.form label { display: block; font-weight: 700; font-size: 13.5px; margin: 12px 0 0; }
.form input:not([type=checkbox]):not([type=file]):not([type=color]):not([type=radio]), .form select, .form textarea, .search { display: block; width: 100%; margin-top: 6px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); min-height: 44px; outline: none; }
.form input:focus, .form select:focus, .form textarea:focus, .search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.form textarea { resize: vertical; line-height: 1.5; }
.form input[type=color] { display: block; margin-top: 6px; width: 64px; height: 40px; border: 0; background: none; }
.form .check { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.form .check input { width: 20px; height: 20px; accent-color: var(--brand); }
.phone-in { display: flex; align-items: stretch; margin-top: 6px; }
.phone-in span { display: grid; place-items: center; padding: 0 12px; border: 1px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px; background: var(--surface); font-weight: 800; color: var(--muted); }
.form .phone-in input { margin-top: 0 !important; border-radius: 0 12px 12px 0 !important; }
.search { margin: 6px 0; }
.drop { position: relative; margin-top: 12px; }
.drop input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.drop label { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px; border: 2px dashed var(--line); border-radius: 16px; text-align: center; color: var(--muted); }
.drop label .ic { width: 30px; height: 30px; color: var(--brand); }
.drop label b { color: var(--ink); }
.or { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.roles { display: grid; gap: 6px; }
.role-row { display: flex !important; align-items: center; justify-content: space-between; gap: 10px; margin: 0 !important; padding: 6px 8px 6px 12px; border-radius: 12px; background: var(--surface-2); border-left: 4px solid var(--gc); }
.role-row span { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.role-row span .ic { color: var(--gc); }
.form .role-row select { width: 120px; margin: 0; min-height: 36px; padding: 6px 8px; background: var(--surface); }
.steps p { color: var(--muted); }

/* login */
.login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: calc(24px + env(safe-area-inset-top)) 0 40px; text-align: center; }
.login-top { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.login-top .langs { margin-left: auto; }
.logo-xl { width: 132px; height: 132px; padding: 18px; object-fit: contain; margin: 0 auto 14px; border-radius: 32px; background: #fff; box-shadow: 0 16px 40px rgba(47,49,137,.25); }
.login h1 { font-size: 32px; }
.login .form { text-align: left; }
.login .form h3 { justify-content: flex-start; }

/* profile / menu */
.profile { display: flex; gap: 14px; align-items: center; margin-top: 16px; }
.menu .li { padding: 13px 0; }
.menu .li > .ic:first-child { color: var(--brand); }

/* bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
