<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- HKBP-style emblem (not the official HKBP logo): a Batak house roof (ruma bolon) under the cross,
       an open Bible, and the red, white and black of the gorga carvings. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3f86"/><stop offset="1" stop-color="#0c1f4a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d77a"/><stop offset="1" stop-color="#c99a2e"/></linearGradient>
    <path id="arcTop" d="M86 256a170 170 0 0 1 340 0"/>
    <path id="arcBot" d="M70 262a186 186 0 0 0 372 0"/>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="256" cy="256" r="146" fill="#0a1a3e" stroke="url(#gold)" stroke-width="4"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" letter-spacing="10" fill="#f6d77a" text-anchor="middle"><textPath href="#arcTop" startOffset="50%">HKBP</textPath></text>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" letter-spacing="7" fill="#f6d77a" text-anchor="middle"><textPath href="#arcBot" startOffset="50%" side="right">SINGAPORE</textPath></text>
  <circle cx="98" cy="262" r="6" fill="#f6d77a"/><circle cx="414" cy="262" r="6" fill="#f6d77a"/>
  <!-- cross -->
  <rect x="246" y="128" width="20" height="74" rx="3" fill="#fff"/>
  <rect x="226" y="146" width="60" height="18" rx="3" fill="#fff"/>
  <!-- ruma bolon roof: rises at both ends -->
  <path d="M136 206 C 190 246, 322 246, 376 206 L 360 262 L 152 262 Z" fill="url(#gold)"/>
  <path d="M136 206 l-10 -14 M376 206 l10 -14" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <!-- gorga band -->
  <rect x="160" y="262" width="192" height="24" fill="#fbf3e4"/>
  <path d="M160 286 l16 -24 16 24 16 -24 16 24 16 -24 16 24 16 -24 16 24 16 -24 16 24 16 -24 16 24z" fill="#c8322b"/>
  <path d="M160 262h192M160 286h192" stroke="#111" stroke-width="4"/>
  <!-- open Bible -->
  <path d="M256 304 c-26 -14 -58 -16 -88 -10 v58 c30 -6 62 -4 88 10z" fill="#fff"/>
  <path d="M256 304 c26 -14 58 -16 88 -10 v58 c-30 -6 -62 -4 -88 10z" fill="#e9eef9"/>
  <path d="M256 304v58" stroke="#0a1a3e" stroke-width="3"/>
  <path d="M184 312c20-3 40-1 58 6M184 326c20-3 40-1 58 6M270 318c18-7 38-9 58-6M270 332c18-7 38-9 58-6" stroke="#9aa9c9" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
