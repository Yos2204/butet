<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natal Naposo</title>
<meta name="description" content="Christmas app for the Naposobulung (youth): Advent calendar, schedule, programme, Kado Silang and quiz, in Bahasa Indonesia, Batak Toba and English.">
<meta name="theme-color" content="#0b1324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Natal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
/* One warm night theme: deep blue sky, candle gold, and the red/black/white of Batak ulos and gorga. */
:root {
  --night: #0b1324;
  --night-2: #121d35;
  --card: #17233f;
  --line: #273a63;
  --gold: #f4c25b;
  --gold-soft: rgba(244,194,91,.14);
  --red: #c8322b;
  --cream: #fbf3e4;
  --text: #eef2fb;
  --muted: #a6b2cc;
  --good: #5fd39a;
  --bad: #ff7a70;
  --display: "Fraunces", Georgia, serif;
  --body: "Nunito Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% 0%, #1a2b52 0%, var(--night) 65%) fixed, var(--night);
  color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
/* faint stars */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 33% 8%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 72% 14%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 30%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 24%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 40%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 92% 6%, #fff 50%, transparent 51%);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--gold); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); position: relative; }
.ulos { height: 8px; background: repeating-linear-gradient(90deg, var(--red) 0 14px, #111 14px 18px, var(--cream) 18px 21px, #111 21px 25px); opacity: .9; }

header.top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 0 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .01em; flex: 1; }
.brand small { display: block; font-family: var(--body); font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.langs { display: flex; background: var(--night-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: none; padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--gold); color: #2a1c00; }

h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.15; margin: 0; }
h2 { font-size: 24px; margin: 18px 0 6px; }
h3 { font-size: 18px; }
.lead { color: var(--muted); margin: 0 0 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 12px 0; }
.card.gold { background: linear-gradient(160deg, #2a2a3f, #1b2543); border-color: rgba(244,194,91,.45); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--night-2); border-radius: 12px; padding: 11px 16px; font-weight: 800; text-decoration: none; color: var(--text); min-height: 44px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #2a1c00; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; }

/* Home */
.hero { text-align: center; padding: 18px 0 6px; }
.star { width: 74px; height: 74px; margin: 0 auto 8px; filter: drop-shadow(0 0 18px rgba(244,194,91,.7)); animation: glow 3s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 6px rgba(244,194,91,.4)); transform: scale(.96); } }
.hero h1 { font-size: 32px; }
.hero .theme { color: var(--gold); font-family: var(--display); font-size: 18px; margin-top: 6px; }
.count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.count div { background: var(--night-2); border-radius: 12px; padding: 10px 4px; text-align: center; }
.count b { display: block; font-family: var(--display); font-size: 28px; color: var(--gold); font-variant-numeric: tabular-nums; }
.count span { font-size: 12px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; min-height: 86px; }
.tile b { display: block; font-family: var(--display); font-size: 17px; margin-bottom: 2px; }
.tile span { font-size: 13px; color: var(--muted); }

/* Advent */
.doors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.door { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-family: var(--display); font-weight: 800; font-size: 20px; position: relative; }
.door.today { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft), 0 0 18px rgba(244,194,91,.35); }
.door.done { background: var(--gold-soft); color: var(--gold); }
.door.done::after { content: "✓"; position: absolute; right: 6px; top: 3px; font-size: 12px; }
.door.locked { opacity: .45; }
.door.d25 { background: var(--red); border-color: var(--red); color: #fff; }
.streak { font-weight: 800; color: var(--gold); }
.verse-ref { color: var(--gold); font-weight: 800; letter-spacing: .02em; }
.thought { font-family: var(--display); font-size: 21px; margin: 6px 0 12px; }
.todo { background: var(--night-2); border-radius: 12px; padding: 12px; }
.todo b { color: var(--gold); display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }

/* Schedule */
.ev { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .d { text-align: center; background: var(--night-2); border-radius: 12px; padding: 6px 0; }
.ev .d b { display: block; font-family: var(--display); font-size: 22px; line-height: 1; }
.ev .d span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.ev.main .d { background: var(--red); }
.ev.main .d span { color: #ffd9d6; }
.ev.past { opacity: .5; }
.ev .t { font-weight: 800; }
.ev .p { font-size: 13px; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--night-2); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }

/* Programme */
.run { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.run:last-child { border-bottom: 0; }
.run time { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
.run .lead-by { font-size: 12px; color: var(--muted); }
.mc { position: fixed; inset: 0; z-index: 50; background: var(--night); display: none; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
.mc.open { display: flex; }
.mc .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; max-width: 900px; margin: 0 auto; width: 100%; }
.mc .when { color: var(--gold); font-weight: 800; font-size: clamp(18px, 3vw, 28px); }
.mc .what { font-family: var(--display); font-size: clamp(30px, 6vw, 64px); margin: 8px 0 18px; }
.mc .say { font-size: clamp(17px, 2.4vw, 26px); color: var(--muted); }
.mc .bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.mc .close { position: absolute; right: 16px; top: calc(12px + env(safe-area-inset-top)); }
.speaking { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--gold-soft); } }

/* Kado Silang */
textarea, input[type=text] { width: 100%; background: var(--night-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
textarea { min-height: 160px; resize: vertical; }
label { font-weight: 800; font-size: 14px; display: block; margin: 12px 0 6px; }
.giver { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.giver:last-child { border-bottom: 0; }
.giver .n { flex: 1; font-weight: 800; }
.giver .sent { color: var(--good); font-size: 12px; }
.gift { width: 150px; height: 150px; margin: 10px auto; display: block; border: 0; background: none; }
.gift.shake { animation: shake .5s ease-in-out infinite; }
@keyframes shake { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.reveal-name { font-family: var(--display); font-size: 40px; color: var(--gold); text-align: center; margin: 6px 0; }

/* Quiz */
.opts { display: grid; gap: 10px; margin-top: 12px; }
.opt { text-align: left; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--night-2); font-weight: 600; min-height: 52px; }
.opt.right { background: rgba(95,211,154,.18); border-color: var(--good); }
.opt.wrong { background: rgba(255,122,112,.15); border-color: var(--bad); }
.progress { height: 6px; background: var(--night-2); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
.progress i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .3s; }
.big-score { font-family: var(--display); font-size: 56px; color: var(--gold); text-align: center; }

/* Batak words */
.word { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.word:last-child { border-bottom: 0; }
.word b { font-family: var(--display); font-size: 18px; color: var(--gold); }
.word span { color: var(--muted); text-align: right; }

/* Bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(11,19,36,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); }
nav.tabs button { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 10.5px; font-weight: 800; min-height: 48px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--gold); }
section[hidden] { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--gold); color: #2a1c00; font-weight: 800; padding: 10px 16px; border-radius: 12px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .star, .gift.shake, .speaking { animation: none; } }
</style>
</head>
<body>
<div class="ulos"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><small data-t="church"></small>Natal Naposo 2026</div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="id">ID</button><button data-lang="bt">BT</button><button data-lang="en">EN</button>
    </div>
  </header>

  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path fill="#f4c25b" d="M50 4l9 33 33 13-33 13-9 33-9-33L8 50l33-13z"/><circle cx="50" cy="50" r="6" fill="#fff8e1"/></svg>
      <h1 data-t="heroTitle"></h1>
      <div class="theme" id="themeLine"></div>
    </div>
    <div class="card gold">
      <div class="row" style="justify-content:space-between"><h3 id="countTitle"></h3><span class="muted small" id="countDate"></span></div>
      <div class="count" id="count"></div>
    </div>
    <div class="card" id="todayCard"></div>
    <div class="tiles">
      <button class="tile" data-go="schedule"><b data-t="tab_schedule"></b><span id="nextEv"></span></button>
      <button class="tile" data-go="kado"><b>Kado Silang</b><span data-t="tileKado"></span></button>
      <button class="tile" data-go="quiz"><b data-t="tab_quiz"></b><span data-t="tileQuiz"></span></button>
      <button class="tile" data-go="batak"><b data-t="tab_batak"></b><span data-t="tileBatak"></span></button>
    </div>
    <div class="card">
      <h3 data-t="greetTitle"></h3>
      <p class="muted small" data-t="greetLead"></p>
      <div class="row">
        <button class="btn primary" id="shareGreet"><span data-t="greetBtn"></span></button>
        <a class="btn" id="askJarvisHome" target="_blank" rel="noopener"><span data-t="askJarvis"></span></a>
      </div>
    </div>
    <p class="muted small" id="installHint" data-t="install"></p>
  </section>

  <!-- ADVENT -->
  <section id="advent" hidden>
    <h2 data-t="adventTitle"></h2>
    <p class="lead"><span data-t="adventLead"></span> <span class="streak" id="streak"></span></p>
    <div class="doors" id="doors"></div>
    <div class="card" id="doorCard" hidden></div>
    <p class="small muted"><label style="display:inline-flex;gap:8px;align-items:center;font-weight:600;margin:0"><input type="checkbox" id="openAll"> <span data-t="openAll"></span></label></p>
  </section>

  <!-- SCHEDULE -->
  <section id="schedule" hidden>
    <h2 data-t="tab_schedule"></h2>
    <p class="lead" data-t="schedLead"></p>
    <div class="card" id="events"></div>
  </section>

  <!-- PROGRAMME -->
  <section id="program" hidden>
    <h2 data-t="progTitle"></h2>
    <p class="lead" data-t="progLead"></p>
    <button class="btn primary block" id="openMc"><span data-t="mcOpen"></span></button>
    <div class="card" id="rundown"></div>
  </section>

  <!-- KADO SILANG -->
  <section id="kado" hidden>
    <h2>Kado Silang</h2>
    <div id="kadoReveal" hidden></div>
    <div id="kadoSetup">
      <p class="lead" data-t="kadoLead"></p>
      <div class="card" id="kadoForm">
        <label for="kadoNames" data-t="kadoNames"></label>
        <textarea id="kadoNames" placeholder="Rina&#10;Josua&#10;Grace&#10;Samuel"></textarea>
        <div class="row" style="align-items:flex-start">
          <div style="flex:1;min-width:140px"><label for="kadoBudget" data-t="kadoBudget"></label><input type="text" id="kadoBudget" value="SGD 15"></div>
          <div style="flex:1;min-width:140px"><label for="kadoWhen" data-t="kadoWhen"></label><input type="text" id="kadoWhen"></div>
        </div>
        <p style="margin-top:14px"><button class="btn primary block" id="kadoDraw"><span data-t="kadoDraw"></span></button></p>
      </div>
      <div class="card" id="kadoList" hidden></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden>
    <h2 data-t="tab_quiz"></h2>
    <div class="card gold">
      <h3 data-t="gugahTitle"></h3>
      <p class="muted small" data-t="gugahLead"></p>
      <div class="row">
        <a class="btn primary" id="gugahLink" target="_blank" rel="noopener"><span data-t="gugahBtn"></span></a>
        <a class="btn" id="askJarvisQuiz" target="_blank" rel="noopener"><span data-t="jarvisQuiz"></span></a>
      </div>
    </div>
    <div class="card" id="quizBox"></div>
  </section>

  <!-- BATAK WORDS -->
  <section id="batak" hidden>
    <h2 data-t="tab_batak"></h2>
    <p class="lead" data-t="batakLead"></p>
    <div class="card" id="wordGame"></div>
    <div class="card" id="wordList"></div>
    <p class="muted small" data-t="batakNote"></p>
  </section>
</div>

<!-- MC screen with Jarvis voice -->
<div class="mc" id="mc" role="dialog" aria-modal="true" aria-label="MC">
  <button class="btn close" id="mcClose" aria-label="Close">✕</button>
  <div class="stage">
    <div class="when" id="mcWhen"></div>
    <div class="what" id="mcWhat"></div>
    <div class="say" id="mcSay"></div>
  </div>
  <div class="bar">
    <button class="btn" id="mcPrev">‹ <span data-t="prev"></span></button>
    <button class="btn primary" id="mcSpeak"><span data-t="mcSpeak"></span></button>
    <button class="btn" id="mcNext"><span data-t="next"></span> ›</button>
  </div>
</div>

<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status"></div>

<script src="data.js?v=1"></script>
<script src="natal.js?v=1"></script>
</body>
</html>
