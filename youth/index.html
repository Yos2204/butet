<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gugah! Youth</title>
<meta name="description" content="Live polls, quizzes, games and anonymous questions for youth sermons. Phones join by QR code.">
<meta name="theme-color" content="#140c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gugah!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Two surfaces: the teacher's planner (follows light/dark) and the live screens (stage + phone), which are always dark so a projector reads well. */
:root{
  --bg:#f6f1ec; --panel:#ffffff; --line:#e6ddd4; --fg:#1f1416; --dim:#6f6064;
  --accent:#b3261e; --accent-fg:#fff; --soft:#f8e8e4; --gold:#c9932b; --ok:#2f7a4b;
  --display:"Fredoka","Segoe UI",system-ui,sans-serif; --text:"Nunito","Segoe UI",system-ui,sans-serif;
  --ulos:repeating-linear-gradient(90deg,#b3261e 0 18px,#1b1012 18px 24px,#f3e6d0 24px 27px,#1b1012 27px 33px,#c9932b 33px 36px,#1b1012 36px 42px);
  /* live surfaces */
  --st-bg:#140c10; --st-panel:#21161b; --st-line:#3a2a31; --st-fg:#fff7ef; --st-dim:#bfaeb3;
  --hot:#ff4d6d; --sun:#ffd23f; --sky:#3bd5ff; --leaf:#4ade80;
  --q0:#e5384f; --q1:#2f7ff0; --q2:#e8a60c; --q3:#23a35a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150f11; --panel:#20181a; --line:#382c2f; --fg:#f6ece6; --dim:#ab9b9f; --accent:#ec5b4f; --accent-fg:#1a0d0c; --soft:#2d1c1c; --gold:#e6b24f; --ok:#6cc08b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150f11; --panel:#20181a; --line:#382c2f; --fg:#f6ece6; --dim:#ab9b9f; --accent:#ec5b4f; --accent-fg:#1a0d0c; --soft:#2d1c1c; --gold:#e6b24f; --ok:#6cc08b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.view{min-height:100%}

/* ---------- planner (home + editor) ---------- */
.ulos{height:8px;background:var(--ulos)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.5px;line-height:1;display:flex;align-items:center;gap:10px}
.logo img{width:42px;height:42px;border-radius:10px}
.logo small{display:block;font-family:var(--text);font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.02em}
.sp{flex:1}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.langs button{border:0;background:none;padding:6px 12px;font-weight:800;font-size:13px;color:var(--dim)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:780px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.card p{margin:0}
.dim{color:var(--dim)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:800;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--fg);min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{font-size:18px;padding:12px 18px;min-height:52px}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.join-card{background:var(--soft);border-color:transparent}
.codein{display:flex;gap:8px}
.codein input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-weight:700;font-size:24px;text-align:center;border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--panel)}
.kits{display:flex;flex-direction:column;gap:10px}
.kit{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel)}
.kit .kt{flex:1;min-width:180px}
.kit b{font-size:17px;display:block}
.kit .icons{font-size:14px;letter-spacing:2px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--dim)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--dim)}
label.f input,label.f textarea,label.f select,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--fg);font-weight:400;min-width:0;width:100%}
textarea{resize:vertical}
.acts{display:flex;flex-direction:column;gap:8px;counter-reset:a}
.act{display:grid;grid-template-columns:34px 30px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}
.act:before{counter-increment:a;content:counter(a);font-weight:800;color:var(--dim);text-align:center}
.act .ic{font-size:22px;text-align:center}
.act .tx{min-width:0}
.act .tx b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.act .tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .ab{display:flex;gap:4px}
.act .ab button{border:1px solid var(--line);background:none;border-radius:8px;width:34px;height:34px;font-size:15px;padding:0}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.addgrid button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.addgrid button:hover{border-color:var(--accent);background:var(--soft)}
.addgrid .ic{font-size:22px}
.addgrid b{font-size:15px}
.addgrid small{color:var(--dim);font-size:12.5px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;align-items:center}
.opt .sh{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.opt input[type=text]{flex:1}
.opt label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--dim);white-space:nowrap}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,5,7,.6);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--panel);color:var(--fg);border-radius:16px;max-width:640px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.sheet h3{margin:0;font-family:var(--display);font-size:22px;font-weight:600;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;border:0;background:none;font-size:22px;width:40px;height:40px}
.guide ol{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:8px}
.guide table{border-collapse:collapse;width:100%;font-size:14px}
.guide td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.guide td:first-child{white-space:nowrap;font-weight:800;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f1416;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-weight:700;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.3)}

/* ---------- live surfaces ---------- */
.live{background:var(--st-bg);color:var(--st-fg);min-height:100%;}
.live .btn{background:var(--st-panel);border-color:var(--st-line);color:var(--st-fg)}
.live .btn.pri{background:var(--hot);border-color:var(--hot);color:#fff}

/* stage (projector) */
#stage{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;position:relative;background:radial-gradient(90% 70% at 50% 0%,#2a1520 0%,var(--st-bg) 70%)}
.sbar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:4px solid transparent;border-image:var(--ulos) 1}
.sbar .kt{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbar .pill{display:flex;align-items:center;gap:10px;background:var(--st-panel);border:1px solid var(--st-line);border-radius:12px;padding:4px 6px 4px 12px;white-space:nowrap}
.sbar .pill b{font-family:var(--display);font-size:24px;letter-spacing:.12em;color:var(--sun)}
.sbar .qr-s{background:#fff;border-radius:6px;padding:3px;width:52px;height:52px}
.sbar .qr-s img,.sbar .qr-s canvas{width:100%!important;height:100%!important}
.sbar .cnt{font-weight:800;font-size:18px;white-space:nowrap}
.smain{position:relative;padding:2vh 4vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sctl{display:flex;gap:10px;align-items:center;padding:10px 18px;background:rgba(0,0,0,.25)}
.sctl .prog{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.sctl .prog i{width:22px;height:8px;border-radius:4px;background:var(--st-line)}
.sctl .prog i.on{background:var(--sun)}
.sctl .prog i.done{background:#7a5c64}
.hide-ctl .sctl{opacity:0;transition:opacity .4s}
.hide-ctl .sctl:hover{opacity:1}

.s-type{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);font-size:clamp(14px,1.6vw,22px);display:flex;align-items:center;gap:10px}
.s-q{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.4vw,64px);line-height:1.12;margin:.3em 0 .5em;text-wrap:balance}
.s-sub{color:var(--st-dim);font-size:clamp(16px,1.8vw,26px)}
.s-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1vh;min-height:0}
.slide-title{font-family:var(--display);font-weight:700;font-size:clamp(36px,6vw,92px);line-height:1.05;text-wrap:balance}
.slide-text{font-size:clamp(20px,2.8vw,42px);line-height:1.35;max-width:1100px;white-space:pre-wrap;text-wrap:pretty}

.joinbig{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5vw;align-items:center;min-height:0}
@media (max-aspect-ratio:1/1){.joinbig{grid-template-columns:1fr;justify-items:center;text-align:center}}
.joinbig .qr-b{background:#fff;padding:14px;border-radius:18px;width:min(42vh,38vw);aspect-ratio:1}
.joinbig .qr-b img,.joinbig .qr-b canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
.joinbig h1{font-family:var(--display);font-size:clamp(34px,5vw,80px);margin:0;line-height:1}
.joinbig .url{font-size:clamp(16px,1.8vw,28px);color:var(--st-dim);margin:.6em 0 .2em;word-break:break-all}
.joinbig .code{font-family:var(--display);font-weight:700;font-size:clamp(48px,9vw,140px);letter-spacing:.14em;color:var(--sun);line-height:1}
.crowd{display:flex;flex-wrap:wrap;gap:8px;margin-top:2vh;max-height:24vh;overflow:hidden}
.crowd span{background:var(--st-panel);border:2px solid var(--st-line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800;font-size:clamp(14px,1.4vw,20px);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}

.bars{display:flex;flex-direction:column;gap:1.4vh;width:100%;max-width:1300px;margin:0 auto}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 5em;gap:12px;align-items:center;font-size:clamp(18px,2.2vw,32px);font-weight:800}
.bar .tr{position:relative;background:var(--st-panel);border-radius:12px;overflow:hidden;min-height:2.1em;display:flex;align-items:center}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:12px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.bar .lb{position:relative;padding:0 .6em;display:flex;align-items:center;gap:.5em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.bar .num{text-align:right;font-family:var(--display)}
.bar.right .tr{outline:4px solid var(--leaf)}
.bar.wrong{opacity:.4}

.qopts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.2vw;width:100%}
.qo{border-radius:14px;padding:2.2vh 1.4vw;font-size:clamp(18px,2.4vw,36px);font-weight:800;display:flex;gap:.6em;align-items:center;color:#fff;min-height:12vh;transition:opacity .4s, transform .4s}
.qo .shp{font-size:1.2em}
.qo.dimmed{opacity:.25}
.qo.right{transform:scale(1.03);box-shadow:0 0 0 5px #fff}
.timer{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,72px);width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--hot);color:#fff;flex:none}
.timer.low{animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.qhead{display:flex;gap:2vw;align-items:center}
.qhead .s-q{flex:1;margin:.2em 0}
.answered{font-weight:800;font-size:clamp(16px,1.8vw,26px);color:var(--st-dim);text-align:center;margin-top:1.6vh}
.countdown{font-family:var(--display);font-weight:700;font-size:clamp(90px,20vw,300px);color:var(--sun);line-height:1;animation:pop .5s}

.cloud{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:.2em .6em;padding:1vh 2vw;min-height:0;overflow:hidden}
.cloud span{font-family:var(--display);font-weight:600;line-height:1.1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.wall{flex:1;columns:3 280px;column-gap:16px;overflow:auto;min-height:0;padding-bottom:10px}
.note{break-inside:avoid;margin:0 0 14px;padding:14px 16px;border-radius:6px 14px 14px 14px;color:#2a1a10;font-size:clamp(16px,1.6vw,24px);font-weight:700;line-height:1.3;position:relative;animation:pop .45s cubic-bezier(.2,1.6,.4,1);word-wrap:break-word}
.note button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.12);border-radius:6px;width:28px;height:28px;color:#2a1a10;opacity:.0}
.note:hover button{opacity:1}
.qa-list{flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.qa{display:flex;gap:14px;align-items:center;background:var(--st-panel);border:1px solid var(--st-line);border-radius:14px;padding:12px 16px;font-size:clamp(17px,1.9vw,28px);font-weight:700}
.qa .v{font-family:var(--display);color:var(--sun);min-width:2.4em;text-align:center;font-size:1.1em}
.qa .tx{flex:1;min-width:0;word-wrap:break-word}
.qa.done{opacity:.45}
.qa button{border:1px solid var(--st-line);background:none;color:var(--st-fg);border-radius:8px;padding:4px 10px;font-size:14px}
.scale-avg{font-family:var(--display);font-size:clamp(50px,8vw,120px);color:var(--sun);line-height:1}
.hist{display:flex;align-items:flex-end;gap:1vw;height:34vh;width:100%;max-width:1100px}
.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-weight:800;gap:4px}
.hist div i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--sun),var(--hot));transition:height .6s}
.ends{display:flex;justify-content:space-between;width:100%;max-width:1100px;color:var(--st-dim);font-weight:800;font-size:clamp(14px,1.6vw,22px)}
.race{display:flex;flex-direction:column;gap:2vh;width:100%;max-width:1300px;margin:0 auto}
.race .bar .tr{min-height:2.6em}
.finish{display:flex;flex-direction:column;gap:8px;max-width:900px;margin:0 auto;width:100%}
.finish div{background:var(--st-panel);border-radius:12px;padding:8px 14px;font-weight:800;font-size:clamp(17px,1.9vw,28px);display:flex;gap:12px;animation:pop .4s}
.verse-big{font-family:var(--display);font-size:clamp(26px,3.6vw,56px);line-height:1.25;max-width:1200px;text-wrap:balance}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4vw;width:100%;align-items:start}
@media (max-aspect-ratio:1/1){.board{grid-template-columns:1fr}}
.board h3{font-family:var(--display);font-size:clamp(20px,2.4vw,34px);margin:0 0 1vh}
.podium{display:flex;flex-direction:column;gap:8px}
.podium div{display:flex;gap:12px;align-items:center;background:var(--st-panel);border-radius:12px;padding:8px 14px;font-weight:800;font-size:clamp(17px,2vw,30px)}
.podium div b{font-family:var(--display);color:var(--sun);margin-left:auto}
.lock{flex:1;display:grid;place-items:center;text-align:center}
.lock .big{font-size:clamp(60px,10vw,140px)}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.floaters span{position:absolute;bottom:-60px;font-size:clamp(34px,4vw,60px);animation:float 3.6s ease-out forwards}
@keyframes float{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:1}100%{transform:translateY(-85vh) scale(1.2) rotate(var(--r));opacity:0}}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:6;width:100%;height:100%}
.netwarn{background:#7a1610;color:#fff;padding:6px 14px;font-weight:700;font-size:14px;text-align:center}

/* phone (student) */
#player{min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 16px calc(10px + env(safe-area-inset-bottom,0px))}
.ptop{display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:4px solid transparent;border-image:var(--ulos) 1}
.ptop .me{font-weight:800;display:flex;align-items:center;gap:6px;min-width:0}
.ptop .me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .team{font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;color:#fff;white-space:nowrap}
.ptop .score{margin-left:auto;font-family:var(--display);font-weight:700;color:var(--sun);font-size:20px;white-space:nowrap}
.pmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:16px 0;text-align:center}
.pmain h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15;margin:0}
.pmain .hint{color:var(--st-dim);font-weight:700}
.pbig{font-size:74px;line-height:1}
.pbtns{display:grid;gap:10px}
.pbtns.two{grid-template-columns:1fr 1fr}
.pb{border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:800;color:#fff;background:var(--st-panel);border:2px solid var(--st-line);min-height:64px;display:flex;gap:10px;align-items:center;text-align:left;transition:transform .1s}
.pb:active{transform:scale(.96)}
.pb.sel{border-color:#fff;box-shadow:0 0 0 3px var(--sun)}
.pb.q{min-height:110px;justify-content:center;font-size:42px}
.pb.q small{font-size:16px;display:block}
.pin{border:2px solid var(--st-line);background:var(--st-panel);color:var(--st-fg);border-radius:14px;padding:14px;font-size:18px;width:100%}
.psend{background:var(--hot);color:#fff;border:0;border-radius:14px;padding:14px;font-size:19px;font-weight:800;min-height:56px;width:100%}
.psend:disabled{opacity:.5}
.slider{width:100%;accent-color:var(--sun);height:40px}
.sval{font-family:var(--display);font-size:64px;color:var(--sun);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:2px solid var(--st-line);background:var(--st-panel);color:var(--st-fg);border-radius:12px;padding:10px 12px;font-weight:800;font-size:17px}
.chips button.used{visibility:hidden}
.chips button.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.built{min-height:64px;border:2px dashed var(--st-line);border-radius:14px;padding:10px;font-weight:700;font-size:18px;text-align:left}
.tapbtn{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:0;margin:0 auto;font-family:var(--display);font-weight:700;font-size:44px;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.35);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tapbtn:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.react{display:flex;justify-content:space-between;gap:4px;padding-top:8px;border-top:1px solid var(--st-line)}
.react button{border:0;background:none;font-size:30px;padding:6px;border-radius:12px;flex:1;transition:transform .1s}
.react button:active{transform:scale(1.4)}
.askbtn{border:1px solid var(--st-line);background:var(--st-panel);color:var(--st-fg);border-radius:12px;padding:10px;font-weight:800;margin:8px 0 6px;width:100%}
.pqa{display:flex;flex-direction:column;gap:8px;text-align:left}
.pqa button{display:flex;gap:10px;align-items:center;border:2px solid var(--st-line);background:var(--st-panel);color:var(--st-fg);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px;text-align:left}
.pqa button b{font-family:var(--display);color:var(--sun);min-width:2em}
.pqa button.on{border-color:var(--sun)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emo button{border:2px solid transparent;background:var(--st-panel);border-radius:10px;font-size:24px;padding:4px 0}
.emo button[aria-pressed="true"]{border-color:var(--sun)}
.result{border-radius:18px;padding:22px 16px;font-family:var(--display);font-weight:700;font-size:30px}
.result.ok{background:var(--leaf);color:#0b2a15}
.result.no{background:#3a2a31}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--leaf)}
.status-dot.off{background:var(--hot);animation:pulse .6s infinite alternate}
.sheet.dark{background:var(--st-panel);color:var(--st-fg)}
.sheet.dark .inp{background:var(--st-bg);border-color:var(--st-line);color:var(--st-fg)}
.sheet.dark .kit{background:var(--st-bg);border-color:var(--st-line)}
#sJv[aria-pressed="true"]{border-color:var(--sky);color:var(--sky)}
/* the Jarvis button glows while Jarvis is talking */
#sJv.talk{box-shadow:0 0 0 2px var(--sky),0 0 22px rgba(59,213,255,.8);animation:jv .8s ease-in-out infinite alternate}
@keyframes jv{to{box-shadow:0 0 0 2px var(--sky),0 0 6px rgba(59,213,255,.3)}}
.jv-ans{margin-top:6px;font-weight:600;color:#9feeff;font-size:.85em}
</style>
</head>
<body>
<noscript><p style="padding:20px">Gugah! needs JavaScript turned on.</p></noscript>
<div id="home" class="view" hidden></div>
<div id="editor" class="view" hidden></div>
<div id="stage" class="view live" hidden></div>
<div id="player" class="view live" hidden></div>
<div id="modalRoot"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="i18n.js?v=1"></script>
<script src="kits.js?v=1"></script>
<script src="app.js?v=1"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
